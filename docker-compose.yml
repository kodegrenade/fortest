services:
  redis:
    image: redis/redis-stack-server:latest
    container_name: fortest-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - fortest-redis-data:/data
    environment:
      - REDIS_ARGS=--appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  app:
    build: .
    container_name: fortest-app
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - PORT=3001
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  fortest-redis-data:
