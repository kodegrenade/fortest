services:
  redis:
    image: redis/redis-stack-server:latest
    container_name: fortest-redis
    ports:
      - "6379:6379"
    volumes:
      - fortest-redis-data:/data
    environment:
      - REDIS_ARGS=--appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  fortest-redis-data:
