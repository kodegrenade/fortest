name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Typecheck
        run: pnpm typecheck

      - name: Run Tests
        run: pnpm test

      - name: Build Packages
        run: pnpm build

      # Install the CLI from its packed tarball, as npm users will, and run it.
      - name: Test the CLI package
        run: pnpm --filter @codegrenade/fortest-cli test:package

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: fortest:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          test "$(docker run --rm fortest:ci --version)" = "$(node -p "require('./packages/cli/package.json').version")"
          docker run -d --name fortest -p 127.0.0.1:3001:3001 fortest:ci
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:3001/api/health && exit 0; sleep 1; done
          docker logs fortest; exit 1
