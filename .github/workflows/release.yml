name: Release

# release-please keeps a "chore(main): release X.Y.Z" PR up to date from conventional commits
# (feat:, fix:, ...). Merging that PR tags vX.Y.Z and creates the GitHub Release; this workflow
# then tests the release and stages @codegrenade/fortest-cli on npm (a maintainer approves it with
# 2FA: `npm stage approve <stage-id>`) and pushes the image to ghcr.io, same version.
# "Run workflow" (workflow_dispatch) redoes the npm + Docker part for an existing tag.
# How releases work and how versions are chosen: RELEASING.md.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish to npm and ghcr.io (e.g. v0.2.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  npm:
    needs: release-please
    # On push: only when release-please just created a release. Manually: always, for the given tag.
    # (!cancelled() lets this job run when release-please is skipped on a manual run.)
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.released == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance; no npm token is stored
    env:
      RELEASE_TAG: ${{ inputs.tag || needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      - name: Build and test the package as it will be published
        run: |
          pnpm --filter @codegrenade/fortest-cli build
          pnpm --filter @codegrenade/fortest-cli test:package

      # `npm stage` needs npm 11.15.0+; Node 24 bundles an older npm. Major 11 is kept on purpose.
      - name: Install npm with staged publishing
        run: |
          npm install -g npm@^11.15.0
          npm --version

      # The trusted publisher is stage-only (npm's recommended setting): this places the version on
      # npm hidden from installs; it goes live when a maintainer approves it with 2FA.
      - name: Stage on npm
        working-directory: packages/cli/dist
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$RELEASE_TAG" ]; then
            echo "::error::Tag $RELEASE_TAG does not match package version $version"
            exit 1
          fi
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published; nothing to stage."
            exit 0
          fi
          npm stage publish --provenance --access public
          {
            echo "## $name@$version is staged on npm, waiting for approval"
            echo
            echo "It is not installable until a maintainer approves it (npm 11.15+ and 2FA required):"
            echo
            echo '```bash'
            echo "npm stage list $name          # shows the stage id"
            echo "npm stage approve <stage-id>  # prompts for 2FA, then publishes"
            echo '```'
            echo
            echo "If staging failed because this version is already staged, approve or reject that stage first."
          } >> "$GITHUB_STEP_SUMMARY"

  docker:
    needs: [release-please, npm] # only after the release passed its tests and was staged
    if: ${{ !cancelled() && needs.npm.result == 'success' }}
    runs-on: ubuntu-latest
    # Add yourself as a required reviewer of this environment (Settings → Environments → release)
    # to hold the image until you've approved the npm stage; without reviewers it runs straight away.
    environment: release
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ inputs.tag || needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/fortest
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}},value=${{ env.RELEASE_TAG }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
